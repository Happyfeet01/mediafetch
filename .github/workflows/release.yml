name: Build and sign MediaFetch release

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: &release_paths
      - 'appinfo/info.xml'
      - 'package.json'
      - 'docs/releases/**'
      - '.github/workflows/release.yml'
      - '.github/scripts/mediafetch-occ.sh'
  pull_request:
    branches: [master]
    paths: *release_paths

permissions:
  contents: read

concurrency:
  group: mediafetch-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: simplexml,xmlreader,mbstring
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read release metadata from this commit
        id: metadata
        run: |
          set -euo pipefail
          version=$(php -r 'echo simplexml_load_file("appinfo/info.xml")->version;')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$version" = "$(node -p 'require("./package.json").version')"
          test -s "docs/releases/$version.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and check release files
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
          find appinfo lib templates -name '*.php' -type f -print0 | xargs -0 -n1 php -l >/dev/null
          php tests/downloader-ip.php
          php tests/yt-dlp-presets.php
          php tests/search-providers.php
          php tests/index-template.php
          npm install --include=dev --no-audit --no-fund
          node tests/l10n.cjs
          node tests/torrent-search-actions.cjs
          npm run build
          for file in js/app.js js/appSettings.js css/app.css css/appSettings.css vendor/autoload.php; do
            test -s "$file"
          done
          stage="$RUNNER_TEMP/stage/mediafetch"
          mkdir -p "$stage" "$RUNNER_TEMP/unsigned"
          rsync -a ./ "$stage/" --exclude='.git' --exclude='.github' --exclude='node_modules' \
            --exclude='/src' --exclude='/tests' --exclude='/dist' --exclude='/build' \
            --exclude='package-lock.json' --exclude='*.map' --exclude='/appinfo/signature.json'
          tar -czf "$RUNNER_TEMP/unsigned/package.tar.gz" -C "$RUNNER_TEMP/stage" mediafetch
          cp "docs/releases/$VERSION.md" "$RUNNER_TEMP/unsigned/release.md"

      - name: Check isolated Nextcloud signing tools
        if: github.event_name == 'pull_request'
        run: bash .github/scripts/mediafetch-occ.sh "$RUNNER_TEMP/stage" check-tools

      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-mediafetch-${{ github.run_id }}
          path: ${{ runner.temp }}/unsigned/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  release:
    needs: build
    if: github.repository == 'Happyfeet01/mediafetch' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check published release and tag
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" --json isDraft,assets > "$RUNNER_TEMP/existing.json"; then
            if jq -e '.isDraft == false' "$RUNNER_TEMP/existing.json" >/dev/null; then
              for suffix in tar.gz signature tar.gz.sha256; do
                jq -e --arg name "mediafetch-$VERSION.$suffix" 'any(.assets[]; .name == $name)' "$RUNNER_TEMP/existing.json" >/dev/null
              done
              echo 'published=true' >> "$GITHUB_OUTPUT"
            fi
          fi
          if git ls-remote --exit-code "https://github.com/$GH_REPO.git" "refs/tags/$tag" >/dev/null; then
            tagged=$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)
            test "$tagged" = "$GITHUB_SHA" || { echo "::error::Tag $tag belongs to another commit"; exit 1; }
          fi

      - uses: actions/download-artifact@v4
        if: steps.existing.outputs.published != 'true'
        with:
          name: unsigned-mediafetch-${{ github.run_id }}
          path: ${{ runner.temp }}/unsigned

      - name: Sign and verify application and final archive
        if: steps.existing.outputs.published != 'true'
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          APP_PUBLIC_CRT: ${{ secrets.APP_PUBLIC_CRT }}
        run: |
          set -euo pipefail
          umask 077
          : "${APP_PRIVATE_KEY:?Set the APP_PRIVATE_KEY Actions secret}"
          : "${APP_PUBLIC_CRT:?Set the APP_PUBLIC_CRT Actions secret}"
          keys=$(mktemp -d)
          trap 'rm -rf -- "$keys"' EXIT
          printf '%s\n' "$APP_PRIVATE_KEY" > "$keys/mediafetch.key"
          printf '%s\n' "$APP_PUBLIC_CRT" > "$keys/mediafetch.crt"
          unset APP_PRIVATE_KEY APP_PUBLIC_CRT
          umask 022
          stage="$RUNNER_TEMP/stage"
          out="$RUNNER_TEMP/signed"
          mkdir -p "$stage" "$out"
          tar -xzf "$RUNNER_TEMP/unsigned/package.tar.gz" -C "$stage"
          bash .github/scripts/mediafetch-occ.sh "$stage" sign "$keys"
          cd "$out"
          archive="mediafetch-$VERSION.tar.gz"
          tar -czf "$archive" -C "$stage" mediafetch
          openssl dgst -sha512 -sign "$keys/mediafetch.key" -out "$RUNNER_TEMP/archive.sig" "$archive"
          openssl base64 -A -in "$RUNNER_TEMP/archive.sig" -out "mediafetch-$VERSION.signature"
          openssl base64 -d -A -in "mediafetch-$VERSION.signature" -out "$RUNNER_TEMP/verify.sig"
          openssl x509 -in "$keys/mediafetch.crt" -pubkey -noout > "$RUNNER_TEMP/pubkey.pem"
          openssl dgst -sha512 -verify "$RUNNER_TEMP/pubkey.pem" -signature "$RUNNER_TEMP/verify.sig" "$archive"
          sha256sum "$archive" > "$archive.sha256"

      - name: Publish verified files together
        if: steps.existing.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "MediaFetch $VERSION" \
              --notes-file "$RUNNER_TEMP/unsigned/release.md"
          fi
          gh release view "$tag" --json isDraft,targetCommitish | jq -e --arg sha "$GITHUB_SHA" \
            '.isDraft and .targetCommitish == $sha' >/dev/null
          cd "$RUNNER_TEMP/signed"
          gh release upload "$tag" "mediafetch-$VERSION.tar.gz" "mediafetch-$VERSION.signature" \
            "mediafetch-$VERSION.tar.gz.sha256" --clobber
          gh release edit "$tag" --draft=false --latest

      - name: Publish signed archive to Nextcloud App Store
        env:
          GH_TOKEN: ${{ github.token }}
          APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
        run: |
          set -euo pipefail
          : "${APPSTORE_TOKEN:?Missing APPSTORE_TOKEN}"
          mkdir -p "$RUNNER_TEMP/store"
          cd "$RUNNER_TEMP/store"
          gh release download "v$VERSION" --pattern "mediafetch-$VERSION.signature" --pattern "mediafetch-$VERSION.tar.gz" --pattern "mediafetch-$VERSION.tar.gz.sha256"
          sha256sum -c "mediafetch-$VERSION.tar.gz.sha256"
          url="https://github.com/$GH_REPO/releases/download/v$VERSION/mediafetch-$VERSION.tar.gz"
          jq -n --arg download "$url" --arg signature "$(cat "mediafetch-$VERSION.signature")" '{download:$download,signature:$signature,nightly:false}' > payload.json
          curl --fail-with-body --silent --show-error --header "Authorization: Token $APPSTORE_TOKEN" --header "Content-Type: application/json" --data-binary @payload.json https://apps.nextcloud.com/api/v1/apps/releases
